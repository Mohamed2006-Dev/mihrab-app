<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شاشة التهيؤ للصلاة — مِحْراب</title>
    <link rel="stylesheet" href="./styles/structural.css" />
    <style>
      .lock-container {
        height: 100vh;
        width: 100vw;
        background: var(--gradient-hero);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--spacing-xl);
        text-align: center;
        gap: var(--spacing-xl);
      }

      .lock-card {
        max-width: 920px;
        width: 100%;
        background: var(--bg-surface-elevated);
        border: 2px solid var(--accent-secondary);
        border-radius: var(--radius-xl);
        padding: var(--spacing-xl);
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--spacing-lg);
      }

      .lock-motivational {
        font-family: var(--font-family-heading);
        font-size: var(--font-size-2xl);
        color: var(--accent-secondary);
        font-weight: 700;
      }

      .lock-timer-pill {
        font-family: var(--font-family-mono);
        font-size: var(--font-size-2xl);
        background: var(--bg-primary);
        color: var(--accent-primary);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-pill);
        padding: var(--spacing-sm) var(--spacing-xl);
        box-shadow: var(--shadow-glow);
      }

      #lock-reveal-bypass[hidden], #lock-streak[hidden] { display: none; }
      .lock-card { max-height: 100%; overflow: auto; }
      #lock-streak, #lock-bypass-error { margin: 0; }
      #lock-bypass-dialog {
        max-width: min(30rem, calc(100vw - 2rem));
        inset: 0;
        margin: auto;
        padding: 1.4rem;
        color: var(--text-primary);
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
      }
      #lock-bypass-dialog::backdrop { background: #0008; }
      .lock-bypass-actions { display: flex; flex-wrap: wrap; gap: .65rem; }
      #lock-bypass-error { color: var(--status-error); }
    </style>
  </head>
  <body>
    <div class="lock-container">
      <div class="lock-card">
        <div class="brand-logo" style="width: 68px; height: 68px; font-size: 2rem">🕌</div>

        <div>
          <h1
            style="
              font-family: var(--font-family-heading);
              font-size: var(--font-size-3xl);
              color: var(--text-primary);
            "
            id="lock-prayer-title"
          >
            حان وقت التهيؤ لصلاة الجماعة
          </h1>
        </div>

        <div class="lock-motivational" id="lock-motivational-quote">
          «قم لصلاتك، عملك سينتظرك.. أما الوقت فإنه يمضي إلى الله»
        </div>

        <div class="hadith-quote-box" id="lock-hadith-text" style="width: 100%; text-align: right">
          ...
        </div>

        <div class="hadith-meta-bar" id="lock-hadith-meta">
          <span class="meta-pill" id="lock-hadith-rawi">الراوي: -</span>
          <span class="meta-pill" id="lock-hadith-grade">الدرجة: صحيح</span>
        </div>

        <div class="lock-timer-pill" id="lock-remaining-timer"> وقت التهيؤ المتبقي: 00:30 </div>

        <p id="lock-streak" hidden></p>
        <button class="btn btn-danger" id="lock-reveal-bypass" hidden>تجاوز الشاشة</button>

        <div style="font-size: var(--font-size-xs); color: var(--text-muted)">
          تُغلق الشاشة تلقائياً عند انتهاء الوقت.
        </div>
      </div>
    </div>

    <dialog id="lock-bypass-dialog" aria-labelledby="lock-bypass-title">
      <h2 id="lock-bypass-title">تجاوز شاشة التهيئة؟</h2>
      <p id="lock-bypass-warning">سيُصفّر التأكيد عداد جلساتك المتتالية ويستهلك تجاوز اليوم. استخدمه عند الضرورة فقط.</p>
      <p id="lock-bypass-error" role="alert"></p>
      <form method="dialog" class="lock-bypass-actions">
        <button class="btn" value="cancel" autofocus>متابعة التهيئة</button>
        <button class="btn btn-danger" id="lock-confirm-bypass" type="button">تأكيد التجاوز</button>
      </form>
    </dialog>

    <script>
      function applyThemeVariables(themeState) {
        if (!themeState || !themeState.cssVariables) return;
        const root = document.documentElement;
        for (const [key, val] of Object.entries(themeState.cssVariables)) {
          root.style.setProperty(key, val);
        }
      }

      let remainingSec = 30;
      let countdownInterval = null;

      function renderTimer() {
        const mm = String(Math.floor(remainingSec / 60)).padStart(2, '0');
        const ss = String(remainingSec % 60).padStart(2, '0');
        const el = document.getElementById('lock-remaining-timer');
        if (el) el.textContent = `وقت التهيؤ المتبقي: ${mm}:${ss}`;
      }

      function startAccurateCountdown(endsAt) {
        clearInterval(countdownInterval);
        const update = () => {
          remainingSec = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
          renderTimer();
          if (remainingSec === 0) clearInterval(countdownInterval);
        };
        countdownInterval = setInterval(update, 250);
        update();
      }

      const bypass = document.getElementById('lock-reveal-bypass');
      const confirmation = document.getElementById('lock-bypass-dialog');
      const confirm = document.getElementById('lock-confirm-bypass');
      const bypassError = document.getElementById('lock-bypass-error');
      let isPreview = false;
      bypass.addEventListener('click', () => {
        bypassError.textContent = '';
        confirmation.showModal();
      });
      confirm.addEventListener('click', async () => {
        confirm.disabled = true;
        try {
          if (isPreview) await window.mihrabApi.forceCloseLockscreen();
          else await window.mihrabApi.bypassPreparation();
        } catch (error) {
          bypassError.textContent = 'تعذّر تسجيل تجاوز هذه الجلسة.';
        } finally {
          confirm.disabled = false;
        }
      });
      if (window.mihrabApi) {
        window.mihrabApi.onLockscreenInit((payload) => {
          if (payload.themeState) applyThemeVariables(payload.themeState);
          if (payload.prayerName) {
            document.getElementById('lock-prayer-title').textContent =
              `حان وقت التهيؤ لـ ${payload.prayerName}`;
          }
          if (payload.motivationalQuote) {
            document.getElementById('lock-motivational-quote').textContent =
              payload.motivationalQuote;
          }
          if (payload.hadith) {
            document.getElementById('lock-hadith-text').textContent = payload.hadith.text || '';
            document.getElementById('lock-hadith-rawi').textContent =
              `الراوي: ${payload.hadith.rawi || '-'}`;
            document.getElementById('lock-hadith-grade').textContent =
              `الدرجة: ${payload.hadith.grade || 'صحيح'}`;
          }

          isPreview = Boolean(payload.isTestMode);
          if (isPreview) {
            bypass.textContent = 'إنهاء المعاينة';
            document.getElementById('lock-bypass-title').textContent = 'إنهاء معاينة شاشة التهيئة؟';
            document.getElementById('lock-bypass-warning').textContent = 'ينهي التأكيد هذه المعاينة فقط.';
            confirm.textContent = 'إنهاء المعاينة';
          }

          const streak = document.getElementById('lock-streak');
          streak.hidden = payload.isTestMode;
          streak.textContent = 'جلسات متتالية حتى الأذان: ' + new Intl.NumberFormat('ar', { numberingSystem: 'arab' }).format(payload.streak);
          startAccurateCountdown(payload.endsAt);
        });

        window.mihrabApi.onRevealPreparationBypass(() => {
          bypass.hidden = false;
          if (!confirmation.open) bypass.focus();
        });

        window.mihrabApi.onLockscreenThemeUpdated((themeState) => {
          applyThemeVariables(themeState);
        });
      }
    </script>
  </body>
</html>
